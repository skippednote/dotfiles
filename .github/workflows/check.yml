# Validates every push and pull request.
#
# Without this, a change that breaks evaluation for one host only surfaces
# when that host is switched - and skippedbook is reached over SSH, so it is
# the one least likely to be switched promptly.
name: check

# The job needs to read the repo and nothing else; without this block the
# token gets write-all, including contents and actions.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a SHA: @main is a moving target with write access to this job.
      - uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56

      # Evaluates both darwinConfigurations. Catches a bad option name, a
      # missing package, or a module that only one host imports.
      - name: nix flake check
        run: nix flake check --no-build

      # The formatter is declared in the flake; this asserts it was run.
      - name: formatting
        run: |
          nix fmt
          git diff --exit-code || {
            echo "::error::nix fmt produced changes - run 'make fmt' and commit"
            exit 1
          }

      # The package set is part of the diff. A commit once dropped thirteen
      # packages as a side effect and every other check still passed, because
      # a smaller configuration is still a valid one.
      - name: package set unchanged
        run: |
          make packages-lock
          git diff --exit-code packages.lock || {
            echo "::error::the package set changed - run 'make packages-lock' and commit"
            exit 1
          }

      # 22 assertions across five simulated machine states.
      - name: bootstrap harness
        run: make test

      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- bootstrap.sh scripts/*.sh tests/bootstrap.sh
