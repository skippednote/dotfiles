# skippedbook: 1Password is not installed here, so op-ssh-sign does not
# exist and signing would fail on every commit. Signing is off rather than
# broken; verification still works from allowed_signers.
#
# This also fixes a real gap: user.email was unset on this machine, so any
# commit made here had no author address.
[commit]
  gpgsign = false

[gpg]
  format = ssh

[gpg "ssh"]
  allowedSignersFile = ~/.config/git/allowed_signers
