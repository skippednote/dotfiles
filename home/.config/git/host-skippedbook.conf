# skippedbook: commits are attributed but not signed.
#
# 1Password is installed here and its ssh agent works - the socket is live
# and the signing key is loaded, with a fingerprint matching the one
# host-skippednote.conf uses. Signing still fails, for a reason that is not
# a misconfiguration: 1Password prompts for approval on this machine's
# display for every signing request, and there is no agent.toml, so the
# default is prompt-every-time. This machine is driven over SSH, where
# nobody can answer that prompt, and git reports "agent returned an error".
#
# So signing is off deliberately rather than left broken. user.email comes
# from the shared .gitconfig, which fixed a real gap - commits made here
# previously had no author address at all.
[commit]
  gpgsign = false

[gpg]
  format = ssh

# Verification still works; only creating signatures needs the agent.
[gpg "ssh"]
  allowedSignersFile = ~/.config/git/allowed_signers
