# Global tools come from Nix; see nix/modules/packages.nix.
#
# What stays here is what nixpkgs cannot serve:
#   claude, codex, pi-coding-agent  - self-updating, which a read-only
#                                     /nix/store breaks
#   android-sdk                     - androidenv is 22.0 and awkward on darwin
#   github:googleworkspace/cli      - unpackaged (nixpkgs `gam` is a
#                                     different project)
#   gcloud, cloud-sql-proxy         - deliberately kept off Nix
#
# Per-project mise.toml files are unaffected by this list.
[tools]
claude = "latest"
"npm:@openai/codex" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
android-sdk = "latest"
"github:googleworkspace/cli" = "latest"
gcloud = "latest"
cloud-sql-proxy = "latest"

[settings]

[settings.github]
credential_command = "gh auth token"
