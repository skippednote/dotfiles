# Global tools come from Nix; see nix/modules/packages.nix.
#
# What stays here is only what nixpkgs cannot serve: claude, codex and
# pi-coding-agent self-update, which a read-only /nix/store breaks.
#
# Per-project mise.toml files are unaffected by this list.
[tools]
claude = "latest"
"npm:@openai/codex" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

[settings]

[settings.github]
credential_command = "gh auth token"
